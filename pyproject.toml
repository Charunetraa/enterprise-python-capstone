[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-python-capstone"
version = "1.0.0"
description = "Automated API data processing and PDF report generation with scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "reportlab>=4.0",
  "matplotlib>=3.8",
  "APScheduler>=3.10,<4"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
capstone-report = "report_generator.cli:main"

[tool.setuptools.packages.find]
include = ["report_generator*"]
